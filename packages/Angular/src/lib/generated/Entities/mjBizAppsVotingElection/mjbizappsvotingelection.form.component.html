            [Record]="record"
            [ShowLabel]="true"
            FieldName="Name"
            Type="textbox"
            [EditMode]="EditMode"
            [FormContext]="formContext"

            [Record]="record"
            [ShowLabel]="true"

            Type="textarea"
            [EditMode]="EditMode"

            [FormContext]="formContext"

        <mj-form-field

            [ShowLabel]="true"
            FieldName="Status"
            Type="select"
            [EditMode]="EditMode"

        <div>
