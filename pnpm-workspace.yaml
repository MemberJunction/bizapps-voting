# pnpm workspace definition for this Open App.
#
# The npm `workspaces` array in package.json is deliberately kept in place: other
# tooling still reads it (MJ's OpenApp install engine walks it in
# findWorkspacePackageJsonFiles, and the CI jq steps read it) — pnpm itself ignores
# it and uses this file. Keep the two glob lists in sync.
#
# Matches the settings MJ core and the first-party BizApps repos use, so an app
# developed here resolves the same way it does inside an MJ checkout.

# LOAD-BEARING. pnpm 10 defaults this to false, which makes internal deps pinned at
# an exact version (this repo pins its own packages at exact versions, e.g.
# "@mj-biz-apps/voting-entities": "1.0.0") resolve from the REGISTRY instead of linking
# to the local package. For an unpublished version that fails loudly; for a
# published one it silently installs a stale copy. Do not remove.
linkWorkspacePackages: true

# Peer handling (strict-peer-dependencies, auto-install-peers) lives in .npmrc.

# pnpm 10 does not run dependency build scripts unless they are allowlisted here.
# Anything omitted installs without its native/postinstall step and fails later at
# runtime rather than at install. Kept in sync with MJ core's allowlist rather than
# trimmed to today's tree: entries for absent packages are inert, and a trimmed list
# silently regresses the moment a transitive dep reappears.
onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@google/genai'
  - '@parcel/watcher'
  - '@zoom/rtms'
  - browser-tabs-lock
  - core-js
  - core-js-pure
  - esbuild
  - isolated-vm
  - lmdb
  - msgpackr-extract
  - oracledb
  - protobufjs
  - rete
  - sharp
  - tesseract.js

packages:
  - 'packages/*'

# Dependency overrides live in package.json under `pnpm.overrides`, matching MJ core
# and the BizApps repos. pnpm does NOT read npm's top-level `overrides` field, and npm
# does not read pnpm's — there is no single block both package managers honour, so
# this repo declares pnpm's and states that npm is not supported (see .npmrc).
